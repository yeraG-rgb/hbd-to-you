<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🌟 A Cosmic Celebration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Animated Stars Background -->
        <div class="stars"></div>

        <!-- Sun and Moon -->
        <div class="sun"></div>
        <div class="moon"></div>

        <!-- Main Content -->
        <div class="content">
            <h1 class="title">Happy Birthday! 🌟</h1>
            <p class="message">
                To the one I like so much and adore endlessly. You light up my universe.
            </p>

            <!-- Cake -->
            <div class="cake">
                <div class="layer bottom"></div>
                <div class="layer middle"></div>
                <div class="layer top"></div>
                <div class="candles">
                    <!-- 23 Purple Candles -->
                    <div class="candle-container">
                        <!-- Candles will be generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Flowers with Messages -->
            <div class="flowers">
                <!-- Flowers will be generated by JS -->
            </div>
        </div>

        <!-- Floating Hearts -->
        <div class="hearts">
            <!-- Hearts will be generated by JS -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
