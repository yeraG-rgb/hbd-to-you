<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🌟 Cosmic Love</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="galaxy-bg">
        <!-- Galaxy Layers -->
        <div class="nebula"></div>
        <div class="stars-far"></div>
        <div class="stars-near"></div>
    </div>

    <!-- Sun and Moon -->
    <div class="sun-container">
        <div class="sun"></div>
        <div class="sun-rays"></div>
    </div>
    <div class="moon-container">
        <div class="moon"></div>
        <div class="moon-craters"></div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h1 class="title">Happy Birthday! 🌟</h1>
        <p class="message">
            To the one I like so much and adore endlessly—happy birthday! You light up my universe.
        </p>

        <!-- Cake -->
        <div class="cake-wrapper">
            <div class="cake">
                <div class="layer bottom-layer"></div>
                <div class="layer middle-layer"></div>
                <div class="layer top-layer"></div>
                <div class="candles-wrapper">
                    <div class="candle-container">
                        <!-- 23 Candles Generated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Flowers -->
        <div class="flowers-grid">
            <!-- Flowers Generated by JS -->
        </div>
    </div>

    <!-- Floating Elements -->
    <div class="particles">
        <!-- Hearts and Sparks Generated by JS -->
    </div>

    <script src="script.js"></script>
</body>
</html>
